name: Build CommandBack

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build mod
        run: gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: CommandBack-Minecraft-1.21.11-Fabric
          path: build/libs/*[0-9].jar
          if-no-files-found: error
